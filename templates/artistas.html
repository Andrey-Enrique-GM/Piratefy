<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#090909">
    <title>Artistas | Piratefy</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/site/favicon.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles_artistas.css') }}">
</head>
<body>
    <div class="artists-page">
        <header class="artists-header">
            <a class="brand-link" href="{{ url_for('index') }}" aria-label="Piratefy">
                <img src="{{ url_for('static', filename='images/site/piratefy_logo.png') }}" alt="Piratefy Logo" class="brand-logo-img">
                <span class="brand-text">Piratefy</span>
            </a>

            <div class="nav-right">
                <span class="username">username</span>
                <img src="{{ url_for('static', filename='images/users/default.png') }}" alt="Foto de perfil" class="user-avatar">
            </div>
        </header>

        <main class="artists-main" id="artistas">
            <section class="artists-intro" aria-labelledby="page-title">
                <p class="eyebrow">TU MÚSICA, TUS DESCUBRIMIENTOS</p>
                <h1 id="page-title">Artistas</h1>
                <p class="intro-copy">Descubre nuestro catálogo de artistas.</p>

                <details class="artist-add">
                    <summary class="artist-add-toggle">
                        <span aria-hidden="true">+</span>
                        Agregar artista
                    </summary>
                    <div class="artist-add-menu">
                        <form class="artist-add-fields" id="artist-form">
                            <label for="artist-name">Nombre del artista</label>
                            <input id="artist-name" type="text" maxlength="100" placeholder="Escribe el nombre" autocomplete="off" required>
                            <button class="artist-add-save" type="submit">Guardar</button>
                        </form>
                    </div>
                </details>
            </section>

            <section class="artist-grid" aria-label="Artistas destacados">
                {% for artista in artistas %}
                    <article class="artist-card">
                        <div class="artist-art art-{{ ['coral', 'blue', 'gold', 'violet', 'green', 'pink'][(loop.index0) % 6] }}" aria-hidden="true">
                            <span>{{ artista.nombre[:2]|upper }}</span>
                        </div>
                        <div class="artist-info">
                            <h2>{{ artista.nombre }}</h2>
                            <p>Artista</p>
                        </div>
                        <span class="card-arrow" aria-hidden="true">↗</span>
                    </article>
                {% else %}
                    <p class="prototype-note">Aún no hay artistas registrados.</p>
                {% endfor %}
            </section>
        </main>
    </div>
    <script src="{{ url_for('static', filename='js/artistas.js') }}"></script>
</body>
</html>

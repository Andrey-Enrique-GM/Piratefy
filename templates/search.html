<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Piratefy</title>
        <link rel="icon" type="image/x-icon" href="{{url_for('static', filename='images/site/favicon.ico')}}">
        <link rel="stylesheet" href="{{url_for('static', filename='css/styles.css')}}">
        <link rel="stylesheet" href="{{url_for('static', filename='css/style_search.css')}}">
    </head>
    <body class="buscar-page">
        <header class="top-navbar">
            <div class="nav-left">
                <a href="{{url_for('index')}}" class="top-link">Catálogo</a>
            </div>

            <div class="nav-right">
                <span class="username">
                    {{ session.get('username') }}
                </span>
                <img src="{{ url_for('static', filename='images/users/default.png') }}" alt="Foto de perfil" class="user-avatar">
            </div>
        </header>

        <main class="buscar-main">
            <div class="hero">
                <img src="{{ url_for('static', filename='images/site/piratefy_logo.png') }}" alt="Piratefy Logo" class="hero-logo">
                <h1 class="hero-title">Pirate<span>fy</span></h1>
            </div>

            <form class="buscar-form" action="/buscar" method="get" role="search">
                <div class="search-bar">
                    <span class="search-icon">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                            <path d="M10.533 1.279c-5.18 0-9.407 4.14-9.407 
                                    9.279s4.226 9.279 9.407 9.279c2.234 0 4.29-.77
                                    5.907-2.058l4.353 4.353a1 1 0 1 0 1.414-1.414l-4.344-4.344a9.157
                                    9.157 0 0 0 2.077-5.816c0-5.14-4.226-9.28-9.407-9.28zm-7.407 
                                    9.279c0-4.006 3.302-7.28 7.407-7.28s7.407 3.274 7.407 7.28-3.302 
                                    7.279-7.407 7.279-7.407-3.273-7.407-7.28z">
                            </path>
                        </svg>
                    </span>
                    <input type="search" name="q" placeholder="Buscar canciones, artistas o álbumes..." 
                            aria-label="Buscar en Piratefy" autocomplete="off" autofocus>
                    <div class="search-divider"></div>
                    <button type="button" class="browse-btn" title="Explorar">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                            <path d="M15 15.5c0 1.105-1.343 2-3 2s-3-.895-3-2 
                                    1.343-2 3-2 3 .895 3 2z">
                            </path>
                            <path d="M1.513 9.37A1 1 0 0 1 2.291 
                                    9h19.418a1 1 0 0 1 .979 
                                    1.208l-2.339 11a1 1 0 0 1-.978.792H4.63a1 
                                    1 0 0 1-.978-.792l-2.339-11a1 
                                    1 0 0 1 .201-.837zM3.525 11l1.913 
                                    9h13.123l1.913-9H3.525zM4 
                                    2a1 1 0 0 1 1-1h14a1 1 0 0 1 1 
                                    1v4h-2V3H6v3H4V2z">
                            </path>
                        </svg>
                    </button>
                </div>

                <fieldset class="search-type">
                    <legend class="sr-only">Buscar por</legend>
                    <label class="tipo"><input type="radio" name="tipo" value="nombre" checked><span>Canciones</span></label>
                    <label class="tipo"><input type="radio" name="tipo" value="artista"><span>Artistas</span></label>
                    <label class="tipo"><input type="radio" name="tipo" value="top"><span>Top artistas</span></label>
                </fieldset>

                <div>
                    <button type="submit" class="btn-buscar">Buscar</button>
                    <button type="submit" class="btn-buscar" formaction="{{url_for('random_song')}}" formnovalidate>Aleatorio</button>
                </div>
            </form>
        </main>

        <footer class="footer">
            <span class="footer-text">© 2026 Piratefy. Ningún derecho reservado.</span>
        </footer>
    </body>
</html>

services:
  web:
    build: .
    image: piratefy:${TAG:-latest}
    ports:
      - "${PUERTO:-5000}:5000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: piratefy
      DB_USER: piratefy
      DB_PASSWORD: ${MYSQL_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: piratefy
      MYSQL_USER: piratefy
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --protocol=TCP --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  mysql-data:
